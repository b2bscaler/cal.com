services:
  calcom:
    image: ghcr.io/b2bscaler/cal.com:main
    pull_policy: always
    restart: always
    expose:
      - "3000"
    environment:
      NODE_ENV: "production"
      NEXT_PUBLIC_APP_NAME: "B2B Scaler"
      NEXT_PUBLIC_SUPPORT_MAIL_ADDRESS: "info@b2bscaler.com"
      NEXT_PUBLIC_COMPANY_NAME: "B2B Scaler"
      INFISICAL_CLIENT_ID: "${INFISICAL_CLIENT_ID}"
      INFISICAL_CLIENT_SECRET: "${INFISICAL_CLIENT_SECRET}"
      INFISICAL_PROJECT_ID: "${INFISICAL_PROJECT_ID}"
      INFISICAL_API_URL: "${INFISICAL_API_URL}"
      INFISICAL_ENV: "${INFISICAL_ENV}"
      INFISICAL_SECRET_PATH: "/calcom"
    command: ["/calcom/scripts/infisical-wrapper.sh", "/calcom/scripts/start.sh"]
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
